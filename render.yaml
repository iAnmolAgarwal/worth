# Render Blueprint for the hosted Worth demo and its demo store, Larkspur Supply (PayPal sandbox only).
# One paid instance with a persistent disk: SQLite lives on the disk, so the service must stay a
# single instance, and a disk rules out zero-downtime deploys (no deploys during judging).
services:
  - type: web
    name: worth
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: worth-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/worth.sqlite
      # Render forwards through two proxies: the first deploy logged
      # "X-Forwarded-For carries 2 address(es)" for direct visits, so trust both hops.
      - key: TRUST_PROXY
        value: '2'
      # APP_ORIGIN falls back to RENDER_EXTERNAL_URL; set it when a custom domain is added.
      - key: APP_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Register https://<host>/api/paypal/webhook in the PayPal sandbox app, then paste its ID.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Off by default. Set it to 'true' deliberately, and only while recording or showing the
      # sandbox decline demo (capture with PayPal-Mock-Response: INSTRUMENT_DECLINED).
      - key: PAYPAL_NEGATIVE_TESTING
        value: 'false'
      # Channel3 search for "Similar items that fit today". Without it the panel stays hidden; when
      # Channel3 fails or credits run out, recorded example results are shown instead.
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_DAILY_LIMIT
        value: '300'
      - key: CLAUDE_IP_HOURLY_LIMIT
        value: '20'
      - key: CLAUDE_DAILY_LIMIT
        value: '200'
      # Signed hand-offs from the demo store (specs/handoff-contract.md). Production refuses to
      # start without both: the shared key (32+ random bytes, base64url, the same value on the
      # store) and the store's own https origin, the only place /check sends shoppers back to.
      - key: HANDOFF_SECRET
        sync: false
      - key: MERCHANT_ORIGIN
        sync: false
      - key: HANDOFF_MERCHANT_ID
        value: larkspur

  # Larkspur Supply, the fictional demo store on its own origin. It keeps no data on disk (sessions
  # and orders live in memory), but stays on a paid plan so it never sleeps between a shopper's
  # visit to Worth and their return.
  - type: web
    name: larkspur-supply
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build:merchant
    startCommand: npm run start:merchant
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: '2'
      # The store's public https origin; falls back to RENDER_EXTERNAL_URL.
      - key: MERCHANT_ORIGIN
        sync: false
      # Worth's public https origin, e.g. https://worth.onrender.com.
      - key: WORTH_ORIGIN
        sync: false
      # 32+ random bytes, base64url; the same value as Worth's HANDOFF_SECRET.
      - key: HANDOFF_SECRET
        sync: false
      - key: HANDOFF_MERCHANT_ID
        value: larkspur
      # The same sandbox REST app as Worth.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Register https://<store host>/api/paypal/webhook in the same sandbox app (its own webhook,
      # alongside Worth's) for PAYMENT.CAPTURE.COMPLETED, then paste that webhook's ID.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
